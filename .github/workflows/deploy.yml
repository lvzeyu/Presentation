name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup @antfu/ni
        run: npm i -g @antfu/ni

      - name: Install dependencies for otree_hosting
        working-directory: ./Other/2026/otree_hosting
        run: nci

      - name: Build otree_hosting
        working-directory: ./Other/2026/otree_hosting
        run: nr build --base /${{github.event.repository.name}}/Other/2026/otree_hosting/

      - name: Create output directory structure
        run: |
          mkdir -p public/Other/2026/otree_hosting
          cp -r ./Other/2026/otree_hosting/dist/* public/Other/2026/otree_hosting/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
